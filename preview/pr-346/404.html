<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Page Not Found | Ariel Anders, PhD</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      (function(l) {
        var REDIRECT_KEY = 'ghpages_redirect';
        var COUNT_KEY = 'ghpages_redirect_count';
        var maxRedirects = 2;

        var count = parseInt(sessionStorage.getItem(COUNT_KEY) || '0', 10);
        if (count >= maxRedirects) {
          sessionStorage.removeItem(COUNT_KEY);
          return; // Stop redirecting to prevent infinite loops, display fallback UI
        }

        var pathname = l.pathname;
        var search = l.search;
        var hash = l.hash;

        // Determine base path and route path for root, repo subpaths, or preview deployments
        function getBaseAndRoute(path) {
          // Preview deployment pattern: /<repo>/preview/pr-<id>/<route> or /preview/pr-<id>/<route>
          var previewMatch = path.match(/^(.*?\/(?:preview|previews)\/[^/]+)(\/.*)?$/i);
          if (previewMatch) {
            var base = previewMatch[1];
            if (!base.endsWith('/')) base += '/';
            var route = previewMatch[2] || '/';
            return { basePath: base, routePath: route };
          }

          // Repo subpath pattern: /portfolio/<route>
          var repoMatch = path.match(/^(\/portfolio)(\/.*)?$/i);
          if (repoMatch) {
            var base = repoMatch[1] + '/';
            var route = repoMatch[2] || '/';
            return { basePath: base, routePath: route };
          }

          // Root path domain (e.g. arii.github.io or custom domain)
          return { basePath: '/', routePath: path };
        }

        var res = getBaseAndRoute(pathname);
        var basePath = res.basePath;
        var routePath = res.routePath;

        // Store full target path in sessionStorage for client SPA router restoration
        var fullTarget = pathname + search + hash;
        sessionStorage.setItem(REDIRECT_KEY, fullTarget);
        sessionStorage.setItem(COUNT_KEY, (count + 1).toString());

        // Construct query parameter fallback URL for index.html SPA router
        var queryPath = routePath.startsWith('/') ? routePath : '/' + routePath;
        var encodedRoute = queryPath.replace(/&/g, '~and~');
        var queryString = '?' + encodedRoute + (search ? '&' + search.slice(1) : '');

        var redirectUrl = l.protocol + '//' + l.host + basePath + queryString + hash;
        l.replace(redirectUrl);
      }(window.location));
    </script>
    <style>
      :root {
        --bg-main: #020617;
        --text-main: #f8fafc;
        --text-muted: #94a3b8;
        --accent: #f59e0b;
        --border: #1e293b;
      }
      body {
        margin: 0;
        padding: 0;
        background-color: var(--bg-main);
        color: var(--text-main);
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
      }
      .container {
        max-width: 500px;
        padding: 2rem;
      }
      h1 {
        font-size: 4rem;
        margin: 0 0 1rem 0;
        color: var(--accent);
        font-weight: 800;
      }
      h2 {
        font-size: 1.5rem;
        margin: 0 0 1rem 0;
        font-weight: 600;
      }
      p {
        color: var(--text-muted);
        line-height: 1.6;
        margin-bottom: 2rem;
      }
      a.btn {
        display: inline-block;
        background-color: var(--text-main);
        color: var(--bg-main);
        padding: 0.75rem 1.5rem;
        border-radius: 0.375rem;
        font-weight: 600;
        text-decoration: none;
        transition: opacity 0.2s ease;
      }
      a.btn:hover {
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>404</h1>
      <h2>Page Not Found</h2>
      <p>The page you are looking for does not exist or has been moved.</p>
      <a href="/" class="btn">Return to Portfolio Home</a>
    </div>
  </body>
</html>
