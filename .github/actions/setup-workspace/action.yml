name: Setup Workspace
description: Sets up Node.js, pnpm, and handles pnpm caching.

runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10.28.2

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version-file: '.node-version'
        cache: 'pnpm'
