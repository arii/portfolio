# .github/actions/impact-analysis/action.yml
name: 'BoomTick Impact Analysis'
description: 'Runs standalone impact analysis and visual diffs using pre-built containerized tools'

inputs:
  github_token:
    description: 'GitHub token with PR comment permissions'
    required: true
  gemini_api_key:
    description: 'Gemini API key for AI review synthesis'
    required: false
  jules_api_key:
    description: 'Jules API key for agent execution'
    required: false

runs:
  using: 'composite'
  steps:
    - name: Parse Jules session ID from PR description
      if: always()
      id: parse_jules
      env:
        PR_BODY: ${{ github.event.pull_request.body }}
      run: |
        TASK_ID=$(echo "$PR_BODY" | grep -oP 'jules\.google\.com/task/\K[0-9]+' | head -1 | tr -cd '0-9' || true)
        if [ -z "$TASK_ID" ]; then
          echo "No Jules task ID found in PR description. Skipping."
        else
          echo "Found Jules task ID: $TASK_ID"
          echo "task_id=$TASK_ID" >> "$GITHUB_OUTPUT"
        fi
      shell: bash

    - name: Run Impact Analysis via Docker Container
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GEMINI_API_KEY: ${{ inputs.gemini_api_key }}
        JULES_API_KEY: ${{ inputs.jules_api_key }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        docker run --rm \
          -e GITHUB_TOKEN="${GITHUB_TOKEN}" \
          -e GITHUB_REPOSITORY="${GITHUB_REPOSITORY}" \
          -e GEMINI_API_KEY="${GEMINI_API_KEY}" \
          -e JULES_API_KEY="${JULES_API_KEY}" \
          -e PR_NUMBER="${PR_NUMBER}" \
          -v "${{ github.workspace }}":/github/workspace \
          -w /github/workspace \
          ghcr.io/arii/boomtick:latest \
          ai review "${PR_NUMBER}" || echo "::warning::Agent code review returned non-zero, likely due to approval permission limitations"

    - name: Send impact analysis to Jules session
      if: always() && steps.parse_jules.outputs.task_id != ''
      env:
        TASK_ID: ${{ steps.parse_jules.outputs.task_id }}
        JULES_API_KEY: ${{ inputs.jules_api_key }}
        GITHUB_TOKEN: ${{ inputs.github_token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        GITHUB_REPOSITORY: ${{ github.repository }}
      run: |
        # Ensure we bind JULES_API_KEY and TASK_ID specifically to trigger Jules code review feedback upstream
        if [ -f "scripts/send-jules-impact.py" ]; then
          echo "Executing send-jules-impact.py from current workspace via container to inherit dev_tools."
          docker run --rm \
            --entrypoint /workspace/scripts/resolve-cli.sh \
            -e GITHUB_TOKEN="${GITHUB_TOKEN}" \
            -e GITHUB_REPOSITORY="${GITHUB_REPOSITORY}" \
            -e JULES_API_KEY="${JULES_API_KEY}" \
            -e TASK_ID="${TASK_ID}" \
            -e PR_NUMBER="${PR_NUMBER}" \
            -v "${{ github.workspace }}":/github/workspace \
            -w /github/workspace \
            ghcr.io/arii/boomtick:latest \
            python3 scripts/send-jules-impact.py || echo "::warning::Failed to send impact to Jules"
        else
          echo "⚠️ Skipping: send-jules-impact.py script not found."
        fi
      shell: bash
