# .github/actions/impact-analysis/action.yml
name: 'BoomTick Impact Analysis'
description: 'Runs standalone impact analysis and visual diffs using pre-built containerized tools'

inputs:
  github_token:
    description: 'GitHub token with PR comment permissions'
    required: true
  gemini_api_key:
    description: 'Gemini API key for AI review synthesis'
    required: false
  jules_api_key:
    description: 'Jules API key for agent execution'
    required: false
  max_reviews:
    description: 'Max number of AI review comment updates before skipping'
    required: false
    default: '3'

runs:
  using: 'composite'
  steps:
    - name: Parse Jules session ID from PR description
      if: always()
      id: parse_jules
      env:
        PR_BODY: ${{ github.event.pull_request.body }}
      run: |
        TASK_ID=$(echo "$PR_BODY" | grep -oP 'jules\.google\.com/task/\K[0-9]+' | head -1 | tr -cd '0-9' || true)
        if [ -z "$TASK_ID" ]; then
          echo "No Jules task ID found in PR description. Skipping."
        else
          echo "Found Jules task ID: $TASK_ID"
          echo "task_id=$TASK_ID" >> "$GITHUB_OUTPUT"
        fi
      shell: bash

    - name: Check Max Reviews Limit
      id: check_reviews
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        MAX_REVIEWS: ${{ inputs.max_reviews || '3' }}
      run: |
        if [ -z "$PR_NUMBER" ]; then
          echo "Not a pull request. Skipping max reviews check."
          echo "skip=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        cat << 'EOF' > check_reviews.py
        import os
        import json
        import urllib.request
        import re
        import sys

        github_token = os.environ.get('GH_TOKEN')
        github_repo = os.environ.get('GITHUB_REPOSITORY')
        pr_number = os.environ.get('PR_NUMBER')
        try:
            max_reviews = int(os.environ.get('MAX_REVIEWS', '3'))
        except ValueError:
            max_reviews = 3

        fetch_url = f"https://api.github.com/repos/{github_repo}/issues/{pr_number}/comments?per_page=100"
        existing_body = ''

        while fetch_url:
            req = urllib.request.Request(fetch_url, headers={
                'Authorization': f'Bearer {github_token}',
                'Accept': 'application/vnd.github.v3+json'
            })
            try:
                with urllib.request.urlopen(req) as response:
                    comments = json.loads(response.read().decode('utf-8'))
                    for c in comments:
                        if c.get('user', {}).get('type') == 'Bot' and '## Deployment Impact Analysis' in c.get('body', ''):
                            existing_body = c.get('body', '')

                    link_header = response.headers.get('Link')
                    fetch_url = None
                    if link_header:
                        links = link_header.split(',')
                        for link in links:
                            if 'rel="next"' in link:
                                fetch_url = link[link.find('<')+1 : link.find('>')]
                                break
            except Exception as e:
                print(f"Error fetching comments: {e}")
                break

        if existing_body:
            match = re.search(r'<!-- ai-review-count: (\d+) -->', existing_body)
            if match:
                current_count = int(match.group(1))
                if current_count >= max_reviews:
                    print(f"Max reviews ({max_reviews}) reached. Current count: {current_count}.")
                    with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                        f.write('skip=true\n')
                    sys.exit(0)
                else:
                    print(f"Review count is {current_count} (max {max_reviews}).")

        with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
            f.write('skip=false\n')
        EOF

        python3 check_reviews.py
        rm check_reviews.py

    - name: Run Impact Analysis via Docker Container
      if: steps.check_reviews.outputs.skip != 'true'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GEMINI_API_KEY: ${{ inputs.gemini_api_key }}
        JULES_API_KEY: ${{ inputs.jules_api_key }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        docker run --rm \
          -e GITHUB_TOKEN="${GITHUB_TOKEN}" \
          -e GITHUB_REPOSITORY="${GITHUB_REPOSITORY}" \
          -e GEMINI_API_KEY="${GEMINI_API_KEY}" \
          -e JULES_API_KEY="${JULES_API_KEY}" \
          -e PR_NUMBER="${PR_NUMBER}" \
          -v "${{ github.workspace }}":/github/workspace \
          -w /github/workspace \
          ghcr.io/arii/boomtick:latest \
          ai review "${PR_NUMBER}" || echo "::warning::Agent code review returned non-zero, likely due to approval permission limitations"

    - name: Ensure artifacts exist
      if: always()
      run: mkdir -p artifacts && echo "## Deployment Impact Analysis\n\nNo impact found." > artifacts/deployment-review.md
      shell: bash

    - name: Send impact analysis to Jules session
      if: always() && steps.check_reviews.outputs.skip != 'true'
      env:
        TASK_ID: ${{ steps.parse_jules.outputs.task_id }}
        JULES_API_KEY: ${{ inputs.jules_api_key }}
        GITHUB_TOKEN: ${{ inputs.github_token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        MAX_REVIEWS: ${{ inputs.max_reviews || '3' }}
      run: |
        if [ -f "scripts/send-jules-impact.py" ]; then
          echo "Executing send-jules-impact.py from current workspace via container to inherit dev_tools."
          docker run --rm \
            --entrypoint /workspace/scripts/resolve-cli.sh \
            -e GITHUB_TOKEN="${GITHUB_TOKEN}" \
            -e GITHUB_REPOSITORY="${GITHUB_REPOSITORY}" \
            -e JULES_API_KEY="${JULES_API_KEY}" \
            -e TASK_ID="${TASK_ID}" \
            -e PR_NUMBER="${PR_NUMBER}" \
            -e MAX_REVIEWS="${MAX_REVIEWS}" \
            -v "${{ github.workspace }}":/github/workspace \
            -w /github/workspace \
            ghcr.io/arii/boomtick:latest \
            python3 /github/workspace/scripts/send-jules-impact.py || echo "::warning::Failed to send impact to Jules"
        else
          echo "⚠️ Skipping: send-jules-impact.py script not found."
        fi
      shell: bash
