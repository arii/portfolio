name: Deploy Portfolio

on:
  push:
    branches: [ main ]

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy to GitHub Pages
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Workspace
        uses: ./.github/actions/setup-workspace

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build with base path
        run: |
          pnpm run build
          cp -r public/previews dist/previews
        env:
          VITE_BASE_PATH: /

      - name: Create GitHub App Token
        uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.BOOMTICK_APP_ID }}
          private-key: ${{ secrets.BOOMTICK_APP_PRIVATE_KEY || secrets.BOOMTICK_PRIVATE_KEY }}
          owner: arii
          repositories: arii.github.io

      - name: Deploy to arii.github.io
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository-name: arii/arii.github.io
          branch: main
          folder: dist
          clean: true
          clean-exclude: |
            phd/
            img/
            CSAIL_And_You_Know_It.mp3
            CSAIL_And_You_Know_It.ogg
            anders.png
            reports/
            rj/
            .nojekyll
