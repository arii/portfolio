name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    paths-ignore:
      - '*.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR checks, but let main and manual runs finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: Build, Lint, Type-Check, Test & Impact Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BOOMTICK_APP_ID: ${{ secrets.APP_ID }}

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Workspace
        uses: arii/boomtick/.github/actions/setup-workspace@3e970a570aee0a550ec6409de769c201c9a5b900 # boomtick main (cli-v0.20.2 + unreleased fixes)
        with:
          setup-python: 'false'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Lint
        run: pnpm run lint

      - name: Run Type Check
        run: pnpm run type-check

      - name: Run Tests
        run: pnpm run test

      - name: Run Fallow Dead Code Audit
        run: pnpm run audit:fallow

      - name: Build Application
        run: pnpm run build

      - name: Automated AI Code Review
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        uses: arii/boomtick@3e970a570aee0a550ec6409de769c201c9a5b900 # boomtick main (cli-v0.20.2 + unreleased fixes)
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        with:
          github-app-id: ${{ secrets.APP_ID }}
          github-app-private-key: ${{ secrets.APP_PRIVATE_KEY }}
          gemini-api-key: ${{ secrets.GEMINI_API_KEY }}
