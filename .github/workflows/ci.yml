name: CI & Impact Analysis Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Workspace
        uses: ./.github/actions/setup-workspace

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Lint
        run: pnpm run lint

      - name: Run Type Check
        run: pnpm run type-check

      - name: Run Tests
        run: pnpm run test

      - name: Build Application
        run: pnpm run build

  impact-analysis:
    name: Run Remote Impact Analysis
    needs: build-and-test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/arii/boomtick/ai-workspace-runner:latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore Workspace Paths from Container
        run: |
          if [ -d "/workspace/mcp" ]; then
            cp -r /workspace/mcp ./mcp
          fi
          if [ -d "/workspace/cli" ]; then
            cp -r /workspace/cli ./cli
          fi
        shell: bash

      - name: Run BoomTick Impact Analysis
        uses: arii/boomtick/mcp/actions/impact-analysis@main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          jules_api_key: ${{ secrets.JULES_API_KEY }}
