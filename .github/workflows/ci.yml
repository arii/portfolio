name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  ci:
    name: Build, Lint, Type-Check, Test & Impact Analysis
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Lint
        run: pnpm run lint

      - name: Run Type Check
        run: pnpm run type-check

      - name: Run Tests
        run: pnpm run test

      - name: Build Application
        run: pnpm run build

      - name: Run Impact Analysis
        run: node scripts/impact-analysis.js

      - name: Generate GitHub App Token
        uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout Boomtick Repository
        uses: actions/checkout@v4
        with:
          repository: arii/boomtick
          token: ${{ steps.app-token.outputs.token }}
          path: boomtick

      - name: Copy Boomtick Assets for Action Execution
        run: |
          cp -r boomtick/mcp ./
          mkdir -p .github/actions
          cp -r boomtick/.github/actions/* .github/actions/ 2>/dev/null || true
        shell: bash

      - name: Run Boomtick Deployment Impact Analysis
        uses: ./mcp/actions/impact-analysis
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          pr_number: ${{ github.event.pull_request.number || '1' }}
          jules_api_key: ${{ secrets.JULES_API_KEY }}
