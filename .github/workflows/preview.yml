name: PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: preview-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  preview:
    name: Manage PR Preview
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Handle PR Closed
        if: github.event.action == 'closed'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Several PR cleanups can push to gh-pages at the same moment, so a
          # push can be rejected as non-fast-forward. Re-sync and retry.
          for attempt in 1 2 3 4 5; do
            git fetch origin gh-pages || exit 0
            git checkout -B gh-pages origin/gh-pages || exit 0
            if [ ! -d "preview/pr-${{ github.event.number }}" ]; then
              echo "No preview folder found to clean up."
              exit 0
            fi
            git rm -rf "preview/pr-${{ github.event.number }}"
            git commit -m "chore: cleanup preview for PR #${{ github.event.number }}"
            if git push origin gh-pages; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt), retrying."
            sleep $((attempt * 3))
          done
          echo "Could not push preview cleanup after 5 attempts." >&2
          exit 1

      - name: Setup Workspace
        if: github.event.action != 'closed'
        uses: arii/boomtick/.github/actions/setup-workspace@3e970a570aee0a550ec6409de769c201c9a5b900 # boomtick main (cli-v0.20.2 + unreleased fixes)
        with:
          setup-python: 'false'

      - name: Install dependencies
        if: github.event.action != 'closed'
        run: pnpm install --frozen-lockfile

      - name: Build Preview
        if: github.event.action != 'closed'
        run: |
          pnpm run build
          cp -r public/previews dist/previews
        env:
          VITE_BASE_PATH: /portfolio/preview/pr-${{ github.event.number }}/
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}

      - name: Deploy Preview to gh-pages branch
        if: github.event.action != 'closed'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          target-folder: preview/pr-${{ github.event.number }}
          commit-message: "deploy: preview for PR #${{ github.event.number }}"

      - name: Comment on PR with Preview Link
        if: github.event.action != 'closed'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: pr-preview-url
          message: |
            ### 🚀 Branch Preview Deployed!

            🔗 **[View Previews Dashboard](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/previews/index.html)**

            Your changes have been successfully built and deployed as a preview branch:
            🔗 **[View Preview](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/preview/pr-${{ github.event.number }}/)**

            _Built with base path: `/portfolio/preview/pr-${{ github.event.number }}/`_
